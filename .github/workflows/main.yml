name: deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # 每月 10、20 日自動更新資料並部署（產品決策 15）
    - cron: '0 0 10,20 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # 資料更新與網站建置分開顯示結果（FR-01.9）
      - name: Update anime data
        run: npm run data:update

      - name: Build site
        run: npm run build -- --mode github

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist

      - uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "deploy"
          description: "Build and deploy to GitHub Pages! [我的新番清單](https://malagege.github.io/vue-myanimelist)"
          username: GitHub Actions
